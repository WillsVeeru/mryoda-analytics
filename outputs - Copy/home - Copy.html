lass="home-kpis" id="homeKPIs"></div><section class="comparison-section"><div class="section-heading"><h2>Revenue at a glance</h2><span>Today, this week and this month</span></div><div class="summary-row" id="homeSummary"></div></section><div class="home-tables"><section class="card home-table"><h2>Revenue performance</h2><div class="table-scroll" id="revenueTable"></div><svg class="home-chart" id="revenueChart" hidden viewBox="0 0 600 210" role="img" aria-label="Daily net revenue chart"></svg><div class="table-tools"><span id="revenueCount"></span><button onclick="toggleChart('revenue')" aria-expanded="true">▥ Hide / Show Chart</button><button onclick="exportHome('revenue')">↓ Excel / CSV</button></div></section><section class="card home-table"><h2>How patients pay</h2><div class="table-scroll" id="paymentTable"></div><svg class="home-chart" id="paymentChart" hidden viewBox="0 0 600 210" role="img" aria-label="Payment mode amounts chart"></svg><div class="table-tools"><span>5 payment modes</span><button onclick="toggleChart('payment')" aria-expanded="true">▥ Hide / Show Chart</button><button onclick="exportHome('payment')">↓ Excel / CSV</button></div></section></div><div id="homeMessage" role="status"></div><p class="home-note">Demonstration data for design review. Live IT DOES data integration is not connected.</p></div></main><script>const $=id=>document.getElementById(id),today='2026-10-21',money=n=>'₹'+Math.round(n).toLocaleString('en-IN'),num=n=>Math.round(n).toLocaleString('en-IN');let revenue=[],payments=[];const shortcuts=['Today','Yesterday','Last 7 days','Month to date','Last 30 days','Quarter to date','Year to date'];$('shortcuts').innerHTML=shortcuts.map((s,i)=>'<button class="quick '+(!i?'active':'')+'" onclick="quickRange('+i+')">'+s+'</button>').join('');const iso=d=>d.toISOString().slice(0,10);function quickRange(i){let end=new Date(today+'T00:00:00Z'),start=new Date(end);if(i===1){start.setUTCDate(start.getUTCDate()-1);end=new Date(start)}if(i===2)
